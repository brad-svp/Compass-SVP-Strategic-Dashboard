kind = "web"
previewPath = "/"
title = "SVP Compass"
description = "SVP Sacramento’s internal staff workspace for strategy, execution, calendars, systems and shared organizational knowledge."
version = "1.0.0"
id = "artifacts/svp-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18473

[services.development]
run = "pnpm --filter @workspace/svp-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/svp-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/svp-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18473"
BASE_PATH = "/"
