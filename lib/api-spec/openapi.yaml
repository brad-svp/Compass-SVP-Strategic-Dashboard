openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /svp/qbos/narratives/{cycleId}/{quarter}:
    parameters:
      - { in: path, name: cycleId, required: true, schema: { type: string } }
      - { in: path, name: quarter, required: true, schema: { type: string, enum: [Q1, Q2, Q3, Q4] } }
    get:
      operationId: getQuarterNarrative
      responses:
        "200":
          description: Optional direction for this cycle and quarter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuarterNarrative" }
    put:
      operationId: saveQuarterNarrative
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuarterNarrativeInput" }
      responses:
        "200":
          description: Saved quarterly direction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuarterNarrative" }
  /svp/brain:
    get:
      operationId: getBrain
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 500 } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: programId, schema: { type: string } }
        - { in: query, name: areaId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [all, unreviewed, reviewed, overdue, conflicts, retired] } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        "200":
          description: Permission-filtered knowledge and search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainWorkspace" }
  /svp/brain/entries:
    post:
      operationId: createBrainEntry
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntryInput" } } } }
      responses:
        "201": { description: Saved as unreviewed, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/entries/{id}:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    get:
      operationId: getBrainEntry
      responses:
        "200": { description: Knowledge with history and files, content: { application/json: { schema: { $ref: "#/components/schemas/BrainDetail" } } } }
    patch:
      operationId: updateBrainEntry
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainEntryInput" } } } }
      responses:
        "200": { description: New unreviewed version, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/entries/{id}/action:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    post:
      operationId: actOnBrainEntry
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainActionInput" } } } }
      responses:
        "200": { description: Knowledge action recorded, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/uploads:
    post:
      operationId: requestBrainUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainUploadInput" } } } }
      responses:
        "201":
          description: Direct private upload URL
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadURL]
                properties: { id: { type: string }, uploadURL: { type: string } }
  /svp/brain/files/{id}/complete:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    post:
      operationId: completeBrainUpload
      responses:
        "200": { description: Source preserved and queued for extraction, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/files/{id}:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    get:
      operationId: downloadBrainFile
      responses:
        "200": { description: Authenticated original attachment, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
    delete:
      operationId: removeBrainFile
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SixVersionInput" } } } }
      responses:
        "200": { description: Attachment removed from current version, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/admin:
    get:
      operationId: getBrainAdmin
      responses:
        "200": { description: Admin review and indexing diagnostics, content: { application/json: { schema: { $ref: "#/components/schemas/BrainAdmin" } } } }
  /svp/brain/settings:
    patch:
      operationId: updateBrainSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainSettingsInput" } } } }
      responses:
        "200": { description: Default review interval updated, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/jobs/{id}/retry:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    post:
      operationId: retryBrainJob
      responses:
        "200": { description: Current content queued again, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/reindex:
    post:
      operationId: reindexBrain
      responses:
        "200": { description: Active content queued, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/connections:
    get:
      operationId: getBrainConnections
      responses:
        "200": { description: Personal Claude setup and grants, content: { application/json: { schema: { $ref: "#/components/schemas/BrainConnections" } } } }
  /svp/brain/connections/{id}:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    delete:
      operationId: revokeBrainConnection
      responses:
        "200": { description: Connection revoked, content: { application/json: { schema: { $ref: "#/components/schemas/MutationResult" } } } }
  /svp/brain/oauth/requests/{id}:
    parameters: [ { $ref: "#/components/parameters/EntityId" } ]
    get:
      operationId: getBrainConsent
      responses:
        "200": { description: OAuth consent request, content: { application/json: { schema: { $ref: "#/components/schemas/BrainConsent" } } } }
    post:
      operationId: decideBrainConsent
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BrainConsentInput" } } } }
      responses:
        "200":
          description: Validated callback
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties: { redirectUrl: { type: string } }
  /svp/brain/skill.zip:
    get:
      operationId: downloadBrainSkill
      responses:
        "200": { description: Importable Claude skill, content: { application/zip: { schema: { type: string, format: binary } } } }
  /svp/calendar/programs:
    post:
      operationId: createCalendarProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarProgramInput" }
      responses:
        "201":
          description: Program created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/programs/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateCalendarProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarProgramInput" }
      responses:
        "200":
          description: Program updated without losing event assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/program-logo-uploads:
    post:
      operationId: requestProgramLogoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramLogoUploadRequest" }
      responses:
        "201":
          description: Private direct-to-storage upload URL
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadURL]
                properties:
                  id: { type: string }
                  uploadURL: { type: string }
  /svp/calendar/program-logo-uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: completeProgramLogoUpload
      responses:
        "200":
          description: Verified immutable logo ready to assign to a program
          content:
            application/json:
              schema:
                type: object
                required: [logoId, logoUrl]
                properties:
                  logoId: { type: string }
                  logoUrl: { type: string }
  /svp/program-logos/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      operationId: getProgramLogo
      responses:
        "200":
          description: Staff-readable program logo
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /svp/purpose:
    get:
      operationId: getSvpPurpose
      responses:
        "200":
          description: Organization mission, vision and values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SvpPurpose" }
    patch:
      operationId: updateSvpPurpose
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpPurposeInput" }
      responses:
        "200":
          description: Mission, vision and values updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/systems:
    get:
      operationId: getSystemsOverview
      responses:
        "200":
          description: SVP systems directory
          content:
            application/json:
              schema:
                type: object
                required: [systems]
                properties:
                  systems:
                    type: array
                    items: { $ref: "#/components/schemas/SvpSystem" }
    post:
      operationId: createSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpSystemInput" }
      responses:
        "201":
          description: System added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/systems/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpSystemInput" }
      responses:
        "200":
          description: System updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: System removed with retained audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar:
    get:
      operationId: getMasterCalendar
      responses:
        "200":
          description: Master events calendar and subscription status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterCalendar" }
  /svp/calendar/events:
    post:
      operationId: createCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Calendar event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/events/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: Event removed with retained history and subscription cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/subscription:
    post:
      operationId: createCalendarSubscription
      responses:
        "201":
          description: New private URL shown once; replaces any previous subscription key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarSubscription" }
    delete:
      operationId: revokeCalendarSubscription
      responses:
        "200":
          description: Private calendar URL revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six:
    get:
      operationId: getSixBySix
      responses:
        "200":
          description: All planning periods, six major moments per period, and visible commitments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SixWorkspace" }
  /svp/six-by-six/view-preferences:
    get:
      operationId: getSixViewPreferences
      responses:
        "200":
          description: The signed-in person's saved 6x6 viewing choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SixViewPreferences" }
    put:
      operationId: saveSixViewPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixViewPreferences" }
      responses:
        "200":
          description: Saved only for the signed-in person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SixViewPreferences" }
  /svp/six-by-six/periods:
    post:
      operationId: createSixPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixPeriodInput" }
      responses:
        "201":
          description: Period and its six empty major-moment slots created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/periods/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixPeriodInput" }
      responses:
        "200":
          description: Planning period updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/moments/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixMoment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixMomentInput" }
      responses:
        "200":
          description: Major moment updated, retaining its commitments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/items:
    post:
      operationId: createSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixItemInput" }
      responses:
        "201":
          description: Commitment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/items/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixItemUpdate" }
      responses:
        "200":
          description: Commitment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: Commitment removed from view, retaining its audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard:
    get:
      operationId: getScorecard
      parameters:
        - in: query
          name: endWeek
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Thirteen Monday-based weeks, all metric definitions, and value revision history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardWorkspace" }
  /svp/scorecard/tracker:
    get:
      operationId: getScorecardTracker
      responses:
        "200":
          description: Current metrics, latest undeleted measurements and dated targets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardTracker" }
  /svp/scorecard/trend:
    get:
      operationId: getScorecardTrend
      parameters:
        - in: query
          name: metricId
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 250 }
      responses:
        "200":
          description: Chronological timestamped measurements with stable cursor pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardTrend" }
  /svp/scorecard/metrics/{id}/measurements:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: appendScorecardMeasurement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardMeasurementInput" }
      responses:
        "201":
          description: A new measurement appended, never an overwrite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/measurements/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    delete:
      operationId: deleteScorecardMeasurement
      responses:
        "200":
          description: Author or admin removed an entry from live history, retaining its audit trail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/metrics:
    post:
      operationId: createScorecardMetric
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardMetricInput" }
      responses:
        "201":
          description: Metric created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/metrics/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateScorecardMetric
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardMetricInput" }
      responses:
        "200":
          description: Metric updated; archiving retains all weekly history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/metrics/{id}/entries/{weekStart}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
      - in: path
        name: weekStart
        required: true
        schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    put:
      operationId: saveScorecardEntry
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardEntryInput" }
      responses:
        "410":
          description: Weekly recording is retired; append a timestamped measurement instead
  /svp/accountability:
    get:
      operationId: getAccountability
      responses:
        "200":
          description: Accountability chart
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountabilitySeat" }
    post:
      operationId: createAccountabilitySeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountabilitySeatInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/accountability/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateAccountabilitySeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountabilitySeatInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteAccountabilitySeat
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /dev-auth:
    get:
      operationId: getDevAuth
      responses:
        "200":
          description: Development login availability and current shortcut session
          content:
            application/json:
              schema:
                type: object
                required: [enabled, signedIn]
                properties:
                  enabled: { type: boolean }
                  signedIn: { type: boolean }
    post:
      operationId: createDevAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginInput"
      responses:
        "200":
          description: Development session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteDevAuth
      responses:
        "200":
          description: Development session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/okrs:
    get:
      operationId: getOkrWorkspace
      responses:
        "200":
          description: All staff OKRs, progress history and comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkrWorkspace" }
  /svp/objectives:
    post:
      operationId: createObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/objectives/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteObjective
      responses:
        "200":
          description: Removed from workspace; history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results:
    post:
      operationId: createKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyResultInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyResultUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteKeyResult
      responses:
        "200":
          description: Removed from workspace; history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results/{id}/check-ins:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: createCheckIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInInput" }
      responses:
        "201":
