openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /svp/calendar/programs:
    post:
      operationId: createCalendarProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarProgramInput" }
      responses:
        "201":
          description: Program created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/programs/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateCalendarProgram
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarProgramInput" }
      responses:
        "200":
          description: Program updated without losing event assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/program-logo-uploads:
    post:
      operationId: requestProgramLogoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramLogoUploadRequest" }
      responses:
        "201":
          description: Private direct-to-storage upload URL
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadURL]
                properties:
                  id: { type: string }
                  uploadURL: { type: string }
  /svp/calendar/program-logo-uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: completeProgramLogoUpload
      responses:
        "200":
          description: Verified immutable logo ready to assign to a program
          content:
            application/json:
              schema:
                type: object
                required: [logoId, logoUrl]
                properties:
                  logoId: { type: string }
                  logoUrl: { type: string }
  /svp/program-logos/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    get:
      operationId: getProgramLogo
      responses:
        "200":
          description: Staff-readable program logo
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /svp/purpose:
    get:
      operationId: getSvpPurpose
      responses:
        "200":
          description: Organization mission, vision and values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SvpPurpose" }
    patch:
      operationId: updateSvpPurpose
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpPurposeInput" }
      responses:
        "200":
          description: Mission, vision and values updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/systems:
    get:
      operationId: getSystemsOverview
      responses:
        "200":
          description: SVP systems directory
          content:
            application/json:
              schema:
                type: object
                required: [systems]
                properties:
                  systems:
                    type: array
                    items: { $ref: "#/components/schemas/SvpSystem" }
    post:
      operationId: createSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpSystemInput" }
      responses:
        "201":
          description: System added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/systems/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SvpSystemInput" }
      responses:
        "200":
          description: System updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteSvpSystem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: System removed with retained audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar:
    get:
      operationId: getMasterCalendar
      responses:
        "200":
          description: Master events calendar and subscription status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterCalendar" }
  /svp/calendar/events:
    post:
      operationId: createCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Calendar event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/events/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteCalendarEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: Event removed with retained history and subscription cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/calendar/subscription:
    post:
      operationId: createCalendarSubscription
      responses:
        "201":
          description: New private URL shown once; replaces any previous subscription key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarSubscription" }
    delete:
      operationId: revokeCalendarSubscription
      responses:
        "200":
          description: Private calendar URL revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six:
    get:
      operationId: getSixBySix
      responses:
        "200":
          description: All planning periods, six major moments per period, and visible commitments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SixWorkspace" }
  /svp/six-by-six/periods:
    post:
      operationId: createSixPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixPeriodInput" }
      responses:
        "201":
          description: Period and its six empty major-moment slots created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/periods/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixPeriodInput" }
      responses:
        "200":
          description: Planning period updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/moments/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixMoment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixMomentInput" }
      responses:
        "200":
          description: Major moment updated, retaining its commitments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/items:
    post:
      operationId: createSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixItemInput" }
      responses:
        "201":
          description: Commitment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/six-by-six/items/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixItemUpdate" }
      responses:
        "200":
          description: Commitment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteSixItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SixVersionInput" }
      responses:
        "200":
          description: Commitment removed from view, retaining its audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard:
    get:
      operationId: getScorecard
      parameters:
        - in: query
          name: endWeek
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Thirteen Monday-based weeks, all metric definitions, and value revision history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScorecardWorkspace" }
  /svp/scorecard/metrics:
    post:
      operationId: createScorecardMetric
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardMetricInput" }
      responses:
        "201":
          description: Metric created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/metrics/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateScorecardMetric
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardMetricInput" }
      responses:
        "200":
          description: Metric updated; archiving retains all weekly history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/scorecard/metrics/{id}/entries/{weekStart}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
      - in: path
        name: weekStart
        required: true
        schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    put:
      operationId: saveScorecardEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScorecardEntryInput" }
      responses:
        "200":
          description: Weekly value saved with immutable revision and goal snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/accountability:
    get:
      operationId: getAccountability
      responses:
        "200":
          description: Accountability chart
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountabilitySeat" }
    post:
      operationId: createAccountabilitySeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountabilitySeatInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/accountability/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateAccountabilitySeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountabilitySeatInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteAccountabilitySeat
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /dev-auth:
    get:
      operationId: getDevAuth
      responses:
        "200":
          description: Development login availability and current shortcut session
          content:
            application/json:
              schema:
                type: object
                required: [enabled, signedIn]
                properties:
                  enabled: { type: boolean }
                  signedIn: { type: boolean }
    post:
      operationId: createDevAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginInput"
      responses:
        "200":
          description: Development session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteDevAuth
      responses:
        "200":
          description: Development session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/okrs:
    get:
      operationId: getOkrWorkspace
      responses:
        "200":
          description: All staff OKRs, progress history and comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkrWorkspace" }
  /svp/objectives:
    post:
      operationId: createObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/objectives/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateObjective
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectiveUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteObjective
      responses:
        "200":
          description: Removed from workspace; history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results:
    post:
      operationId: createKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyResultInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateKeyResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyResultUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteKeyResult
      responses:
        "200":
          description: Removed from workspace; history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/key-results/{id}/check-ins:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: createCheckIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInInput" }
      responses:
        "201":
          description: Append-only progress update recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/comments:
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/EntityId"
    patch:
      operationId: updateComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentUpdate" }
      responses:
        "200":
          description: Updated by author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
    delete:
      operationId: deleteComment
      responses:
        "200":
          description: Deleted by author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResult" }
  /svp/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /svp/foundation:
    get:
      operationId: getFoundation
      responses:
        "200":
          description: Staff workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Foundation"
  /svp/admin/{collection}:
    post:
      operationId: createFoundationItem
      parameters:
        - $ref: "#/components/parameters/Collection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
  /svp/admin/{collection}/{id}:
    patch:
      operationId: updateFoundationItem
      parameters:
        - $ref: "#/components/parameters/Collection"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Collection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        enum: [staff, areas, cycles]
  schemas:
    ProgramLogoUploadRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 2097152 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
    CalendarProgramInput:
      type: object
      additionalProperties: false
      required: [name, logoId, active, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        logoId: { type: [string, "null"] }
        active: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    CalendarProgram:
      type: object
      required: [id, name, logoId, logoUrl, active, version, canEdit, eventCount, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        logoId: { type: [string, "null"] }
        logoUrl: { type: [string, "null"] }
        active: { type: boolean }
        version: { type: integer }
        canEdit: { type: boolean }
        eventCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    SvpValue:
      type: object
      additionalProperties: false
      required: [id, title, description]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
    SvpPurposeInput:
      type: object
      additionalProperties: false
      required: [mission, vision, values, expectedVersion]
      properties:
        mission: { type: string, maxLength: 6000 }
        vision: { type: string, maxLength: 6000 }
        values:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/SvpValue" }
        expectedVersion: { type: integer, minimum: 1 }
    SvpPurpose:
      type: object
      required: [mission, vision, values, version, canEdit, sourceUrls, updatedAt]
      properties:
        mission: { type: string }
        vision: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/SvpValue" }
        version: { type: integer }
        canEdit: { type: boolean }
        sourceUrls:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time }
    SvpSystemInput:
      type: object
      additionalProperties: false
      required: [name, url, purpose, howUsed, audience, usedByIds, ownerId, category, cadence, accessInstructions, status, expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, minLength: 1, maxLength: 2000 }
        purpose: { type: string, maxLength: 4000 }
        howUsed: { type: string, maxLength: 8000 }
        audience: { type: string, maxLength: 2000 }
        usedByIds:
          type: array
          maxItems: 100
          items: { type: string }
        ownerId: { type: [string, "null"] }
        category: { type: string, maxLength: 100 }
        cadence: { type: string, maxLength: 200 }
        accessInstructions: { type: string, maxLength: 4000 }
        status: { type: string, enum: [active, retired] }
        expectedVersion: { type: integer, minimum: 0 }
    SvpSystem:
      allOf:
        - $ref: "#/components/schemas/SvpSystemInput"
        - type: object
          required: [id, version, canEdit, createdAt, updatedAt]
          properties:
            id: { type: string }
            version: { type: integer }
            canEdit: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CalendarEventInput:
      type: object
      additionalProperties: false
      required: [title, program, planningYear, startDate, endDate, allDay, startsAt, endsAt, location, dateStatus, locationStatus, audience, wixUrl, notes, ownerId, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        program: { type: string, maxLength: 120 }
        planningYear: { type: integer, minimum: 1900, maximum: 9999 }
        startDate: { type: [string, "null"] }
        endDate: { type: [string, "null"] }
        allDay: { type: boolean }
        startsAt: { type: [string, "null"] }
        endsAt: { type: [string, "null"] }
        location: { type: string, maxLength: 1000 }
        dateStatus: { type: string, enum: [proposed, confirmed, tbd, cancelled] }
        locationStatus: { type: string, enum: [proposed, confirmed, tbd, not_applicable] }
        audience:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 120 }
        wixUrl: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 16000 }
        ownerId: { type: [string, "null"] }
        expectedVersion: { type: integer, minimum: 0 }
    CalendarEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventInput"
        - type: object
          required: [id, version, sourceUrl, imported, canEdit, updatedAt]
          properties:
            id: { type: string }
            programId: { type: [string, "null"] }
            version: { type: integer }
            sourceUrl: { type: [string, "null"] }
            imported: { type: boolean }
            canEdit: { type: boolean }
            updatedAt: { type: string, format: date-time }
    MasterCalendar:
      type: object
      required: [events, timeZone, hasSubscription, isPublished]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
        timeZone: { type: string }
        hasSubscription: { type: boolean }
        isPublished: { type: boolean }
        sourceImport: { $ref: "#/components/schemas/CalendarImportInfo" }
        programs:
          type: array
          items: { $ref: "#/components/schemas/CalendarProgram" }
    CalendarImportInfo:
      type: object
      required: [sourceUrl, complete, recordCount, year2026, year2027, note]
      properties:
        sourceUrl: { type: string }
        complete: { type: boolean }
        recordCount: { type: integer }
        year2026: { type: integer }
        year2027: { type: integer }
        note: { type: string }
    CalendarSubscription:
      type: object
      required: [path]
      properties:
        path: { type: string }
    SixVersionInput:
      type: object
