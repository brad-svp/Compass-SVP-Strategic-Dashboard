components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Collection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        enum: [staff, areas, cycles]
  schemas:
    QuarterNarrativeInput:
      type: object
      required: [narrative, expectedVersion]
      properties:
        narrative: { type: string, maxLength: 12000 }
        expectedVersion: { type: integer, minimum: 0 }
    QuarterNarrative:
      type: object
      required: [cycleId, quarter, narrative, version, canEdit, updatedAt]
      properties:
        cycleId: { type: string }
        quarter: { type: string, enum: [Q1, Q2, Q3, Q4] }
        narrative: { type: string }
        version: { type: integer }
        canEdit: { type: boolean }
        updatedAt: { type: [string, "null"] }
    BrainLink:
      type: object
      required: [domain, id, label]
      properties:
        domain: { type: string, maxLength: 60 }
        id: { type: string, maxLength: 100 }
        label: { type: string, maxLength: 200 }
    BrainEntryInput:
      type: object
      additionalProperties: false
      required: [title, summary, content, kind, programId, areaId, ownerId, tags, sourceUrls, links, visibility, reviewIntervalDays, expectedVersion]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, maxLength: 2000 }
        content: { type: string, maxLength: 80000 }
        kind: { type: string, enum: [playbook, procedure, strategy, decision, lesson, reference] }
        programId: { type: [string, "null"] }
        areaId: { type: [string, "null"] }
        ownerId: { type: string }
        tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 60 } }
        sourceUrls: { type: array, maxItems: 20, items: { type: string, maxLength: 2000 } }
        links: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/BrainLink" } }
        visibility: { type: string, enum: [staff, admin] }
        reviewIntervalDays: { type: integer, minimum: 7, maximum: 730 }
        expectedVersion: { type: integer, minimum: 0 }
        requestKey: { type: string, minLength: 1, maxLength: 100 }
    BrainEntry:
      allOf:
        - $ref: "#/components/schemas/BrainEntryInput"
        - type: object
          required: [id, authorId, reviewStatus, retired, conflict, version, via, reviewedAt, reviewerId, reviewDueAt, overdue, indexStatus, createdAt, updatedAt, canEdit, mergedIntoId]
          properties:
            id: { type: string }
            authorId: { type: string }
            reviewStatus: { type: string, enum: [unreviewed, reviewed] }
            retired: { type: boolean }
            conflict: { type: string }
            mergedIntoId: { type: [string, "null"] }
            version: { type: integer }
            via: { type: string }
            reviewedAt: { type: [string, "null"] }
            reviewerId: { type: [string, "null"] }
            reviewDueAt: { type: [string, "null"] }
            overdue: { type: boolean }
            indexStatus: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
            canEdit: { type: boolean }
    BrainHit:
      type: object
      required: [entryId, title, reviewStatus, overdue, conflict, excerpt, sourceLabel, fileId, page, score, href]
      properties:
        entryId: { type: string }
        title: { type: string }
        reviewStatus: { type: string }
        overdue: { type: boolean }
        conflict: { type: string }
        excerpt: { type: string }
        sourceLabel: { type: string }
        fileId: { type: [string, "null"] }
        page: { type: [integer, "null"] }
        score: { type: number }
        href: { type: string }
    BrainWorkspace:
      type: object
